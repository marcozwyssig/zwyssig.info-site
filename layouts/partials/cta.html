<section class="cta-band">
  <div class="wrap cta-inner">
    <div class="cta-copy">
      <h2>{{ i18n "cta_heading" }}</h2>
      <p>{{ i18n "cta_text" }}</p>
    </div>
    <div class="cta-actions">
      <a class="btn btn-primary" href="mailto:{{ .Site.Params.company.email }}?{{ querify "subject" (i18n "cta_button") }}">{{ i18n "cta_button" }}</a>
      <a class="btn btn-secondary" href="tel:{{ .Site.Params.company.phoneHref }}">{{ .Site.Params.company.phone }}</a>
    </div>
  </div>
</section>
